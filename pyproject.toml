[project]
name = "lineartvstream"
version = "0.2.0"
description = "Streaming server that recreates linear TV experience"
authors = []
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "colorama==0.4.6",
    "dotenv==0.9.9",
    "Flask==3.1.1",
    "hypermedia==5.4.0",
    "isodate==0.7.2",
    "MarkupSafe==3.0.2",
    "pydantic==2.12.5",
    "pydantic_core==2.41.5",
    "python-dotenv==1.2.1",
    "python-slugify==8.0.4",
    "requests==2.32.5",
    "SQLAlchemy==2.0.43",
    "tmdbsimple==2.9.1",
    "yt-dlp==2026.1.29.165626.dev0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

py-modules = []
where = ["src"]

[project.scripts]
tvstreamer-prep = "lineartvstream.tvpreparer:main"